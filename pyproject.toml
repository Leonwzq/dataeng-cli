[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataeng-cli"
version = "0.1.0"
description = "科研公共数据源采集与集成 CLI 工具"
dependencies = [
    "click>=8.1.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "schedule>=1.2.0",
    "rich>=13.0.0"
]

[project.scripts]
dataeng-cli = "dataeng_cli.cli:main"
